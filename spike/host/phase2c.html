<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>kotoyomi mruby bridge — Phase 2c smoke</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2em; line-height: 1.6; }
      pre { background: #f5f5f5; padding: 1em; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>Phase 2c smoke (boot only)</h1>
    <p>
      Boots <code>mruby.wasm</code> and runs the bridge smoke test
      (Float, JS.object, nil?, Promise.then, addEventListener+once).
    </p>
    <pre id="status">starting...</pre>
    <script type="module">
      import { boot, evalRuby } from "../mrbgem/mruby-js-bridge/js/adapter.js";
      const status = document.getElementById("status");
      try {
        await boot("./mruby.wasm");
        const SCRIPT = `
          JS = JSBridge
          doc = JS.global[:document]
          doc.title = 'Phase 2c OK'
          n = JS.eval('1.5 + 2.25').to_f
          puts "float = #{n}"
          JS.global[:Promise].resolve(7).then { |v| puts "promise resolved: #{v.to_i}" }
        `;
        evalRuby(SCRIPT);
        status.textContent = "boot OK — check console + tab title";
      } catch (err) {
        console.error(err);
        status.textContent = `boot failed: ${err.message}`;
      }
    </script>
  </body>
</html>
